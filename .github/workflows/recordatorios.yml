# Llama cada 5 minutos al endpoint que envía las notificaciones push programadas.
# Es gratis en repositorios públicos. Para activarlo, en GitHub → Settings → Secrets and variables → Actions:
#   - Variable  APP_URL      = https://tu-app.vercel.app   (sin "/" al final)
#   - Secreto   CRON_SECRET  = el mismo valor que pusiste en Vercel (opcional pero recomendado)
# Mientras APP_URL no exista, el flujo termina sin hacer nada.
name: Recordatorios push

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enviar recordatorios pendientes
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "La variable APP_URL no está configurada; se omite."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/push/cron"
